apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-con-auth2-ingress
  annotations:
    konghq.com/strip-path: "true"
spec:
  ingressClassName: kong
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-con-auth2-service
            port:
              number: 5000
  