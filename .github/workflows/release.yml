# ============================================================
# Release Pipeline - Se ejecuta cuando se crea un tag (v1.0.0)
# ============================================================
# Propósito: Cuando creas un tag como v1.0.0, este workflow
#            construye la imagen con ese tag, la sube a Docker Hub
#            y crea un Release en GitHub automáticamente.
# ============================================================

name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'   # Se activa con tags como v1.0.0, v2.1.3, etc.

jobs:
  # ── PASO 1: Construir y subir imagen con tag de versión ──
  build-and-push:
    name: 🐳 Build & Push - Imagen con versión
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Extraer versión del tag (ej. v1.0.0 → 1.0.0)
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen Docker con versión
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-con-auth:${{ steps.version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/api-con-auth:latest

  # ── PASO 2: Crear Release en GitHub ──
  github-release:
    name: 📦 Release - Crear release en GitHub
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          body: |
            ## 🚀 Release ${{ github.ref_name }}

            ### Docker Image
            ```
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/api-con-auth:${{ github.ref_name }}
            ```

            ### Changes
            Revisa los commits incluidos en este release para ver los cambios.
          generate_release_notes: true
