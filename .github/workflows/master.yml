# ============================================================
# Master Pipeline - Se ejecuta cuando se hace merge a master
# ============================================================
# Propósito: Después de aprobar el PR, construir la imagen 
#            Docker final y subirla a Docker Hub.
# ============================================================

name: Master Pipeline

on:
  push:
    branches:
      - master

jobs:
  # ── PASO 1: Lint (doble verificación) ──
  lint:
    name: 🔍 Lint - Verificar calidad de código
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias + herramientas de lint
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Ejecutar flake8
        run: |
          flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app.py --count --max-line-length=120 --statistics

  # ── PASO 2: Construir y subir imagen Docker a Docker Hub ──
  build-and-push:
    name: 🐳 Build & Push - Subir imagen a Docker Hub
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-con-auth:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/api-con-auth:${{ github.sha }}
