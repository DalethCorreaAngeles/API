name: Preview per PR

on:
  pull_request:
    types: [opened, synchronize, closed]

jobs:
  create-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Create preview environment with Helm 
        run: |
          echo "Create preview environment for PR #${{ github.event.number }}"
          echo "helm install api-pr-${{ github.event.number }} ./charts --namespace pr-${{ github.event.number }} --create-namespace"
 
  destroy-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Destroy preview environment
        run: |
          echo "Destroy preview environment for PR #${{ github.event.number }}"
          echo "helm uninstall api-pr-${{ github.event.number }} --namespace pr-${{ github.event.number }}"
          echo "kubectl delete namespace pr-${{ github.event.number }}"
